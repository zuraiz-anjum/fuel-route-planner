name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check the pinned dependencies against the vulnerability databases
        run: pipx run pip-audit -r requirements.txt

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t fuel-route-planner .
      # Configured as production would be, with a host named and the
      # redirect to HTTPS on; the container's own health check, which asks
      # as 127.0.0.1 over plain HTTP, has to pass regardless.
      - run: docker run --detach --name planner --env DJANGO_ALLOWED_HOSTS=example.com --env DJANGO_SECURE_SSL_REDIRECT=1 fuel-route-planner
      - name: Wait for the container's own health check
        run: |
          for i in $(seq 1 40); do
            status=$(docker inspect --format '{{.State.Health.Status}}' planner)
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 3
          done
          echo "health status: $status"
          docker logs planner
          exit 1
