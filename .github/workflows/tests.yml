name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check the pinned dependencies against the vulnerability databases
        run: pipx run pip-audit -r requirements.txt

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t fuel-route-planner .
      - run: docker run --detach --name planner --publish 8000:8000 fuel-route-planner
      - name: Wait for the health check
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/healthz/; then exit 0; fi
            sleep 2
          done
          docker logs planner
          exit 1
