<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fuel route planner</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  html, body { height: 100%; margin: 0; font: 14px/1.4 system-ui, sans-serif; color: #222; }
  body { display: flex; }
  aside { width: 380px; flex: none; overflow-y: auto; padding: 16px; box-sizing: border-box; border-right: 1px solid #ddd; }
  #map { flex: 1; min-height: 300px; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  form label { display: block; margin-bottom: 8px; }
  form input { width: 100%; box-sizing: border-box; padding: 6px; border: 1px solid #bbb; border-radius: 3px; }
  form .row { display: flex; gap: 8px; }
  form .row label { flex: 1; }
  form button { padding: 7px 14px; }
  #status { margin: 12px 0; color: #666; }
  #status.error { color: #b00020; }
  dl { display: grid; grid-template-columns: auto auto; gap: 2px 12px; margin: 0 0 12px; }
  dt { color: #666; }
  dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  ol { padding-left: 20px; margin: 0; }
  li { margin-bottom: 10px; }
  li .where { font-weight: 600; }
  li .detail { color: #555; }
  @media (max-width: 720px) {
    body { flex-direction: column; }
    aside { width: auto; border-right: 0; border-bottom: 1px solid #ddd; max-height: 50%; }
  }
</style>
</head>
<body>
<aside>
  <h1>Fuel route planner</h1>
  <form id="trip" method="get">
    <label>Start <input name="start" required placeholder="Dallas, TX"></label>
    <label>Finish <input name="finish" required placeholder="Los Angeles, CA"></label>
    <div class="row">
      <label>Fuel at start (gal) <input name="start_fuel" type="number" min="0" max="50" step="0.1" placeholder="0"></label>
      <label>Stop cost ($) <input name="stop_cost" type="number" min="0" step="1" placeholder="10"></label>
    </div>
    <button type="submit">Plan route</button>
  </form>
  <div id="status"></div>
  <section id="result" hidden>
    <dl id="summary"></dl>
    <ol id="stops"></ol>
  </section>
</aside>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
(function () {
  var apiUrl = "{% url 'route-api' %}";
  var map = L.map("map").setView([39.5, -98.35], 4);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);
  var drawn = L.layerGroup().addTo(map);

  var form = document.getElementById("trip");
  var params = new URLSearchParams(location.search);
  Array.prototype.forEach.call(form.elements, function (field) {
    if (field.name && params.has(field.name)) field.value = params.get(field.name);
  });
  if (params.has("start") && params.has("finish")) load(params);

  function load(params) {
    setStatus("Planning…", false);
    fetch(apiUrl + "?" + params.toString())
      .then(function (response) {
        return response.json().then(function (body) { return { ok: response.ok, body: body }; });
      })
      .then(function (result) {
        if (!result.ok) { setStatus(result.body.error || "Request failed", true); return; }
        setStatus("", false);
        render(result.body);
      })
      .catch(function (err) { setStatus("Request failed: " + err, true); });
  }

  function setStatus(text, isError) {
    var status = document.getElementById("status");
    status.textContent = text;
    status.className = isError ? "error" : "";
  }

  function render(trip) {
    drawn.clearLayers();
    var line = trip.route.geometry.coordinates.map(function (c) { return [c[1], c[0]]; });
    var path = L.polyline(line, { color: "#1f5fbf", weight: 4 }).addTo(drawn);
    L.marker([trip.start.lat, trip.start.lon]).addTo(drawn).bindPopup("Start: " + trip.start.label);
    L.marker([trip.finish.lat, trip.finish.lon]).addTo(drawn).bindPopup("Finish: " + trip.finish.label);
    trip.stops.forEach(function (stop) {
      var s = stop.station;
      L.circleMarker([s.lat, s.lon], { radius: 8, color: "#d9480f", fillColor: "#ff922b", fillOpacity: 0.9 })
        .addTo(drawn)
        .bindPopup(
          "<b>" + escapeHtml(s.name) + "</b><br>" + escapeHtml(s.city + ", " + s.state) +
          "<br>$" + s.price_per_gallon.toFixed(3) + "/gal &middot; " + stop.gallons.toFixed(1) +
          " gal &middot; $" + stop.cost.toFixed(2)
        );
    });
    map.fitBounds(path.getBounds(), { padding: [30, 30] });

    var summary = document.getElementById("summary");
    summary.replaceChildren();
    var sum = trip.summary;
    [
      ["Distance", trip.route.distance_miles.toFixed(0) + " mi"],
      ["Drive time", hours(trip.route.duration_minutes)],
      ["Fuel burned", sum.fuel_consumed_gallons.toFixed(1) + " gal"],
      ["Fuel bought", sum.fuel_purchased_gallons.toFixed(1) + " gal"],
      ["Total fuel cost", "$" + sum.total_fuel_cost.toFixed(2)],
      ["Average price", sum.average_price_per_gallon === null ? "—" : "$" + sum.average_price_per_gallon.toFixed(3) + "/gal"],
      ["Stops en route", String(sum.en_route_stops)]
    ].forEach(function (pair) {
      summary.appendChild(el("dt", pair[0]));
      summary.appendChild(el("dd", pair[1]));
    });

    var list = document.getElementById("stops");
    list.replaceChildren();
    trip.stops.forEach(function (stop) {
      var s = stop.station;
      var item = document.createElement("li");
      var where = stop.kind === "departure" ? "Before leaving" : "Mile " + stop.mile.toFixed(0);
      item.appendChild(el("div", where + " — " + s.name, "where"));
      item.appendChild(el("div", s.city + ", " + s.state + " · " + s.address, "detail"));
      item.appendChild(el("div",
        "$" + s.price_per_gallon.toFixed(3) + "/gal · " + stop.gallons.toFixed(1) + " gal · $" +
        stop.cost.toFixed(2) + " · tank " + stop.tank_on_arrival_gallons.toFixed(1) + " → " +
        stop.tank_on_departure_gallons.toFixed(1) + " gal", "detail"));
      list.appendChild(item);
    });
    document.getElementById("result").hidden = false;
  }

  function el(tag, text, className) {
    var node = document.createElement(tag);
    node.textContent = text;
    if (className) node.className = className;
    return node;
  }

  function hours(minutes) {
    return Math.floor(minutes / 60) + " h " + (minutes % 60) + " min";
  }

  function escapeHtml(text) {
    return String(text).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }
})();
</script>
</body>
</html>
