<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fuel route planner</title>
<!-- No icon to fetch, so no 404 in the log for every visit. -->
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css"
      integrity="sha384-uTttxo/aOKbdE5RlD/SPzSDoDmNvGlUYPjONi2MN/b7c9HPSvW07OIuyP7uL6jxK" crossorigin="">
<style>
  html, body { height: 100%; margin: 0; font: 14px/1.4 system-ui, sans-serif; color: #222; }
  body { display: flex; }
  aside { width: 380px; flex: none; overflow-y: auto; padding: 16px; box-sizing: border-box; border-right: 1px solid #ddd; }
  #map { flex: 1; min-height: 300px; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .field { margin-bottom: 8px; }
  .field label { display: block; }
  form input { width: 100%; box-sizing: border-box; padding: 6px; border: 1px solid #bbb; border-radius: 3px; font: inherit; }
  form .row { display: flex; gap: 8px; }
  form .row .field { flex: 1; }
  form button { padding: 7px 14px; }
  .places { position: fixed; z-index: 10; box-sizing: border-box; margin: 0; padding: 4px 0; list-style: none; max-height: 320px; overflow-y: auto; background: #fff; border: 1px solid #bbb; border-top: 0; border-radius: 0 0 3px 3px; box-shadow: 0 6px 14px rgba(0, 0, 0, 0.1); }
  .places li { padding: 6px 8px; cursor: pointer; }
  .places li:hover, .places li[aria-selected="true"] { background: #e8f0fb; }
  #status { margin: 12px 0; color: #666; }
  #status.error { color: #b00020; }
  dl { display: grid; grid-template-columns: auto auto; gap: 2px 12px; margin: 0 0 12px; }
  dt { color: #666; }
  dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  ol { padding-left: 20px; margin: 0; }
  #stops li { margin-bottom: 10px; }
  #stops .where { font-weight: 600; }
  #stops .detail { color: #555; }
  .stop { width: 16px; height: 16px; box-sizing: border-box; border-radius: 50%; background: #ff922b; border: 2px solid #d9480f; cursor: pointer; }
  #map .notice { margin: 0; padding: 16px; color: #666; }
  .maplibregl-popup-content { font: 13px/1.4 system-ui, sans-serif; padding: 10px 14px; }
  @media (max-width: 720px) {
    body { flex-direction: column; }
    aside { width: auto; border-right: 0; border-bottom: 1px solid #ddd; max-height: 50%; }
    /* Below this size iPhones zoom in on a box they focus. */
    form input { font-size: 16px; }
  }
</style>
</head>
<body>
<aside>
  <h1>Fuel route planner</h1>
  <form id="trip" method="get">
    <div class="field">
      <label for="start">Start</label>
      <input id="start" name="start" required placeholder="Dallas, TX" autocomplete="off"
             role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="start-places">
      <ul id="start-places" class="places" role="listbox" hidden></ul>
    </div>
    <div class="field">
      <label for="finish">Finish</label>
      <input id="finish" name="finish" required placeholder="Los Angeles, CA" autocomplete="off"
             role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="finish-places">
      <ul id="finish-places" class="places" role="listbox" hidden></ul>
    </div>
    <div class="row">
      <div class="field">
        <label for="start_fuel">Fuel at start (gal)</label>
        <input id="start_fuel" name="start_fuel" type="number" min="0" max="50" step="0.1" placeholder="0">
      </div>
      <div class="field">
        <label for="stop_cost">Stop cost ($)</label>
        <input id="stop_cost" name="stop_cost" type="number" min="0" step="1" placeholder="10">
      </div>
    </div>
    <button type="submit">Plan route</button>
  </form>
  <div id="status"></div>
  <section id="result" hidden>
    <dl id="summary"></dl>
    <ol id="stops"></ol>
  </section>
</aside>
<div id="map"></div>

<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"
        integrity="sha384-5+cfbwT0iiub6VsQAdn6yz16nr6sDiQoHx6tm4O8OVYXHYOxcffFmCJBL0dgdvGp" crossorigin=""></script>
<script>
(function () {
  var apiUrl = "{% url 'route-api' %}";
  var placesUrl = "{% url 'places-api' %}";

  // OpenFreeMap's tiles need no key, and unlike the OpenStreetMap
  // Foundation's own they are served to browsers that send no Referer.
  var map = null;
  var mapReady = null;
  try {
    map = new maplibregl.Map({
      container: "map",
      style: "https://tiles.openfreemap.org/styles/liberty",
      center: [-98.35, 39.5],
      zoom: 3.3
    });
    map.addControl(new maplibregl.NavigationControl({ showCompass: false }));
    mapReady = new Promise(function (resolve) { map.on("load", resolve); });
  } catch (err) {
    // No WebGL. The plan is still read out beside the empty map.
    document.getElementById("map").appendChild(
      el("p", "This browser cannot draw the map; the plan still appears beside it.", "notice"));
  }

  var form = document.getElementById("trip");
  var aside = document.querySelector("aside");
  var params = new URLSearchParams(location.search);
  Array.prototype.forEach.call(form.elements, function (field) {
    // The API takes the last value of a repeated parameter; so does the form.
    if (field.name && params.has(field.name)) field.value = params.getAll(field.name).pop();
  });
  if (params.has("start") && params.has("finish")) load(params);

  ["start", "finish"].forEach(function (name) {
    offerPlaces(document.getElementById(name), document.getElementById(name + "-places"));
  });

  // US cities under the box as you type, from the API's own city table, so
  // that what is picked resolves to exactly that place.
  function offerPlaces(input, list) {
    var timer = null;
    var controller = null;
    var asked = 0;
    var offered = [];
    var active = -1;

    input.addEventListener("input", function () {
      clearTimeout(timer);
      timer = setTimeout(ask, 150);
    });
    input.addEventListener("keydown", function (event) {
      if (list.hidden) return;
      if (event.key === "ArrowDown" || event.key === "ArrowUp") {
        event.preventDefault();
        var step = event.key === "ArrowDown" ? 1 : -1;
        highlight(active < 0 ? (step > 0 ? 0 : offered.length - 1) : active + step);
      } else if (event.key === "Enter" && active >= 0) {
        event.preventDefault();
        pick(offered[active]);
      } else if (event.key === "Escape") {
        close();
      }
    });
    input.addEventListener("blur", close);
    // Pressing anywhere on the list keeps the focus in the box, so scrolling
    // it or grabbing its scrollbar does not close it. Only a click picks,
    // and a finger that drags produces none.
    list.addEventListener("pointerdown", function (event) { event.preventDefault(); });
    list.addEventListener("click", function (event) {
      var item = event.target.closest("li");
      if (item) pick(offered[Number(item.dataset.index)]);
    });
    // The list is fixed to the viewport rather than laid inside the sidebar,
    // which scrolls and would clip it on a phone; it follows the box instead.
    aside.addEventListener("scroll", follow);
    window.addEventListener("resize", follow);
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", follow);
      window.visualViewport.addEventListener("scroll", follow);
    }

    function ask() {
      var text = input.value.trim();
      if (controller) controller.abort();
      if (text.length < 2) { close(); return; }
      controller = new AbortController();
      var mine = ++asked;
      fetch(placesUrl + "?" + new URLSearchParams({ q: text }), { signal: controller.signal })
        .then(function (response) { return response.ok ? response.json() : { places: [] }; })
        .then(function (body) { if (mine === asked) show(body.places); })
        .catch(function () {});  // a lost suggestion is no loss
    }

    function show(places) {
      offered = places;
      active = -1;
      list.replaceChildren();
      places.forEach(function (place, index) {
        var item = el("li", place.label);
        item.id = list.id + "-" + index;
        item.setAttribute("role", "option");
        item.dataset.index = index;
        list.appendChild(item);
      });
      list.hidden = places.length === 0;
      input.setAttribute("aria-expanded", String(!list.hidden));
      input.removeAttribute("aria-activedescendant");
      follow();
    }

    function follow() {
      if (list.hidden) return;
      var box = input.getBoundingClientRect();
      var frame = aside.getBoundingClientRect();
      if (box.bottom < frame.top || box.top > frame.bottom) {
        close();  // the box has scrolled out of the sidebar; nothing to hang the list from
        return;
      }
      list.style.left = box.left + "px";
      list.style.top = box.bottom + "px";
      list.style.width = box.width + "px";
      // No taller than the room under the box, so the last entries are never
      // off the bottom of a short viewport; the list scrolls instead. A
      // phone's keyboard shrinks only the visual viewport, so that is the
      // one measured where the browser has it.
      var seen = window.visualViewport;
      var bottom = seen ? seen.offsetTop + seen.height : window.innerHeight;
      list.style.maxHeight = Math.max(100, Math.min(320, bottom - box.bottom - 8)) + "px";
    }

    function highlight(index) {
      active = (index + offered.length) % offered.length;
      Array.prototype.forEach.call(list.children, function (item, i) {
        item.setAttribute("aria-selected", String(i === active));
      });
      input.setAttribute("aria-activedescendant", list.children[active].id);
      list.children[active].scrollIntoView({ block: "nearest" });
    }

    function pick(place) {
      input.value = place.label;
      close();
    }

    function close() {
      clearTimeout(timer);
      list.hidden = true;
      input.setAttribute("aria-expanded", "false");
      input.removeAttribute("aria-activedescendant");
    }
  }

  function load(params) {
    setStatus("Planning…", false);
    fetch(apiUrl + "?" + params.toString())
      .then(function (response) {
        return response.json().then(function (body) { return { ok: response.ok, body: body }; });
      })
      .then(function (result) {
        if (!result.ok) { setStatus(result.body.error || "Request failed", true); return; }
        setStatus("", false);
        render(result.body);
      })
      .catch(function (err) { setStatus("Request failed: " + err, true); });
  }

  function setStatus(text, isError) {
    var status = document.getElementById("status");
    status.textContent = text;
    status.className = isError ? "error" : "";
  }

  function render(trip) {
    if (mapReady) mapReady.then(function () { draw(trip); });

    var summary = document.getElementById("summary");
    summary.replaceChildren();
    var sum = trip.summary;
    [
      ["Distance", trip.route.distance_miles.toFixed(0) + " mi"],
      ["Drive time", hours(trip.route.duration_minutes)],
      ["Fuel burned", sum.fuel_consumed_gallons.toFixed(1) + " gal"],
      ["Fuel bought", sum.fuel_purchased_gallons.toFixed(1) + " gal"],
      ["Total fuel cost", "$" + sum.total_fuel_cost.toFixed(2)],
      ["Average price", sum.average_price_per_gallon === null ? "—" : "$" + sum.average_price_per_gallon.toFixed(3) + "/gal"],
      ["Stops en route", String(sum.en_route_stops)]
    ].forEach(function (pair) {
      summary.appendChild(el("dt", pair[0]));
      summary.appendChild(el("dd", pair[1]));
    });

    var list = document.getElementById("stops");
    list.replaceChildren();
    trip.stops.forEach(function (stop) {
      var s = stop.station;
      var item = document.createElement("li");
      var where = stop.kind === "departure"
        ? "Before leaving"
        : "Mile " + stop.mile.toFixed(0) + " (" + stop.leg_miles.toFixed(0) + " mi on)";
      item.appendChild(el("div", where + " — " + s.name, "where"));
      item.appendChild(el("div", s.city + ", " + s.state + " · " + s.address, "detail"));
      item.appendChild(el("div",
        "$" + s.price_per_gallon.toFixed(3) + "/gal · " + stop.gallons.toFixed(1) + " gal · $" +
        stop.cost.toFixed(2) + " · tank " + stop.tank_on_arrival_gallons.toFixed(1) + " → " +
        stop.tank_on_departure_gallons.toFixed(1) + " gal", "detail"));
      list.appendChild(item);
    });
    document.getElementById("result").hidden = false;
  }

  // The form submits by navigating, so a page draws one trip; there is
  // nothing to clear first.
  function draw(trip) {
    var coordinates = trip.route.geometry.coordinates;
    map.addSource("route", { type: "geojson", data: { type: "Feature", geometry: trip.route.geometry } });
    map.addLayer({
      id: "route",
      type: "line",
      source: "route",
      layout: { "line-join": "round", "line-cap": "round" },
      paint: { "line-color": "#1f5fbf", "line-width": 4 }
    }, firstLabelLayer());

    new maplibregl.Marker().setLngLat([trip.start.lon, trip.start.lat])
      .setPopup(new maplibregl.Popup().setText("Start: " + trip.start.label)).addTo(map);
    new maplibregl.Marker().setLngLat([trip.finish.lon, trip.finish.lat])
      .setPopup(new maplibregl.Popup().setText("Finish: " + trip.finish.label)).addTo(map);
    trip.stops.forEach(function (stop) {
      var s = stop.station;
      var dot = document.createElement("div");
      dot.className = "stop";
      dot.title = s.name;
      new maplibregl.Marker({ element: dot }).setLngLat([s.lon, s.lat])
        .setPopup(new maplibregl.Popup({ offset: 12 }).setHTML(
          "<b>" + escapeHtml(s.name) + "</b><br>" + escapeHtml(s.city + ", " + s.state) +
          "<br>$" + s.price_per_gallon.toFixed(3) + "/gal &middot; " + stop.gallons.toFixed(1) +
          " gal &middot; $" + stop.cost.toFixed(2)
        ))
        .addTo(map);
    });

    var bounds = coordinates.reduce(function (box, point) { return box.extend(point); },
      new maplibregl.LngLatBounds(coordinates[0], coordinates[0]));
    map.fitBounds(bounds, { padding: 40, duration: 0 });
  }

  // Put the route under the place names, which are the style's symbol layers.
  function firstLabelLayer() {
    var layers = map.getStyle().layers;
    for (var i = 0; i < layers.length; i++) {
      if (layers[i].type === "symbol") return layers[i].id;
    }
    return undefined;
  }

  function el(tag, text, className) {
    var node = document.createElement(tag);
    node.textContent = text;
    if (className) node.className = className;
    return node;
  }

  function hours(minutes) {
    return Math.floor(minutes / 60) + " h " + (minutes % 60) + " min";
  }

  function escapeHtml(text) {
    return String(text).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }
})();
</script>
</body>
</html>
